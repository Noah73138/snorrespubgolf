<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4a2a">
<title>West End Pub Golf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: one phone-first column. Pennant hero for the hole in play, then score entry, leaderboard, scorecard, rules. */
:root{
  --turf:#0b4a2a; --turf-2:#126b3c; --turf-3:#1a8a4e;
  --chalk:#fffdf6; --ink:#122016; --muted:#a9d7b8;
  --pink:#ff4fa3; --sun:#ffd23f; --sky:#4cc9ff; --tang:#ff8a3d; --lilac:#b48cff;
  --good:#7dffa8; --bad:#ff7a7a;
  --f-display:"Shrikhand","Cooper Black",Georgia,serif;
  --f-body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{background:var(--turf)}
body{background:var(--turf);color:var(--chalk);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 38px,transparent 38px 76px);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--turf)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;display:grid;gap:28px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.6rem;line-height:1;color:var(--sun);text-shadow:3px 3px 0 var(--pink)}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-shadow:none;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-weight:600;font-size:.82rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2s infinite}
.chip.warn .dot{background:var(--sun);animation:none}
.chip.off .dot{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(125,255,168,.6)}100%{box-shadow:0 0 0 10px rgba(125,255,168,0)}}

/* progress rail */
.rail{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rail span{height:10px;border-radius:3px;background:rgba(255,255,255,.12)}
.rail span.done{background:var(--turf-3)}
.rail span.now{background:var(--pink);box-shadow:0 0 12px var(--pink)}

/* hero pennant */
.hole{position:relative;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.pin{position:relative;width:96px;height:150px}
.pin::before{content:"";position:absolute;left:10px;top:0;width:5px;height:150px;background:var(--chalk);border-radius:3px}
.flag{position:absolute;left:15px;top:4px;width:82px;height:66px;background:var(--pink);clip-path:polygon(0 0,100% 50%,0 100%);display:flex;align-items:center;padding-left:10px;transform-origin:left center;animation:wave 2.6s ease-in-out infinite}
.flag b{font-family:var(--f-display);font-size:1.9rem;color:var(--chalk);line-height:1}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-6deg)}}
.cup{position:absolute;left:-2px;bottom:-6px;width:30px;height:12px;border-radius:50%;background:var(--ink)}
.hole-body{display:grid;gap:10px;min-width:0}
.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.drink{font-family:var(--f-display);font-size:clamp(2rem,7vw,3.2rem);line-height:1.02;color:var(--chalk)}
.venue{font-weight:800;font-size:1.15rem;color:var(--sky)}
.venue a{color:inherit;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.par{font-family:var(--f-num);background:var(--sun);color:var(--ink);padding:4px 12px;border-radius:6px;font-size:1rem}
.walk{color:var(--muted);font-size:.92rem}
.challenge{grid-column:1/-1;background:var(--sun);color:var(--ink);border-radius:18px;padding:16px 18px;display:grid;gap:6px;transform:rotate(-.6deg);box-shadow:6px 6px 0 var(--pink)}
.challenge .eyebrow{color:#5a4a00}
.challenge p{margin:0;font-size:1.25rem;font-weight:800;line-height:1.25}
.challenge .pen{font-size:.98rem;font-weight:600}
@media (max-width:420px){.pin{width:70px;height:120px}.pin::before{height:120px}.flag{width:64px;height:54px}.flag b{font-size:1.5rem}}

/* section heads */
.sec{display:grid;gap:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:1.7rem;color:var(--sun)}
.sec-h p{margin:0;color:var(--muted);font-size:.9rem}

/* leaderboard */
.board{display:grid;gap:10px}
.row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;background:var(--chalk);color:var(--ink);border-radius:14px;padding:10px 14px;border-left:10px solid var(--tc);transition:transform .4s}
.row .pos{font-family:var(--f-display);font-size:1.6rem;line-height:1;color:var(--tc-ink)}
.row .tn{font-weight:800;font-size:1.05rem;line-height:1.15}
.row .pl{font-size:.85rem;color:#4b5a4f}
.row .tot{text-align:right}
.row .tot b{display:block;font-family:var(--f-num);font-size:1.5rem;line-height:1}
.row .tot span{font-size:.75rem;color:#4b5a4f}
.row.lead{box-shadow:0 0 0 3px var(--sun),6px 6px 0 var(--pink)}
.under{color:#0b7a37}.over{color:#c02a2a}

/* entry */
.mine{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.mine select{font:inherit;background:var(--turf-2);color:var(--chalk);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 10px}
.teams{display:grid;gap:12px}
.tcard{background:rgba(255,255,255,.07);border:2px solid var(--tc);border-radius:18px;padding:12px 14px;display:grid;gap:10px}
.tcard.me{background:rgba(255,255,255,.14)}
.tcard h3{font-size:1.05rem;font-weight:800;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tcard h3 .tsum{font-family:var(--f-num);font-weight:500}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px}
.pname{font-weight:600;min-width:0}
.pname small{display:block;font-size:.75rem;color:var(--muted);font-weight:600}
.step{display:grid;justify-items:center;gap:3px}
.step label{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.ctl{display:flex;align-items:center;background:var(--turf);border-radius:999px;border:1px solid rgba(255,255,255,.2)}
.ctl button{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:var(--chalk);font-size:1.3rem;font-weight:800}
.ctl button:active{background:rgba(255,255,255,.15)}
.ctl output{min-width:28px;text-align:center;font-family:var(--f-num);font-size:1.1rem}
.step.pen output{color:var(--tang)}
.ctl.dirty{border-color:var(--sun);box-shadow:0 0 0 2px rgba(255,210,63,.35)}
.ro .ctl button{display:none}
.ro .ctl{padding:6px 10px}

/* scorecard */
.cardwrap{overflow-x:auto;border-radius:14px;background:var(--chalk)}
table{border-collapse:collapse;width:100%;color:var(--ink);font-size:.9rem;min-width:560px}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid #e3e8e0}
th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:#4b5a4f;font-weight:800}
td.n,th.n{text-align:left;padding-left:12px;white-space:nowrap}
tr.parrow td{background:#fff3c4;font-family:var(--f-num)}
tr.tsep td{border-top:3px solid var(--ink)}
td.hidden{color:#b5bdb3}
td.cur{background:#ffe3f1}
td .badge{display:inline-block;min-width:24px;padding:2px 4px;border-radius:6px;font-family:var(--f-num)}
.b-under{background:#c9f7d8}.b-par{background:transparent}.b-over{background:#ffd9d9}.b-bad{background:#ffb3b3}
td.tot{font-family:var(--f-num);font-weight:500;background:#f2f6ee}

/* rules */
.rules{background:rgba(0,0,0,.18);border-radius:18px;padding:16px 18px}
.rules ol{margin:0;padding-left:1.2em;display:grid;gap:8px;max-width:62ch}
.rules b{color:var(--sun)}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.terms span{font-size:.8rem;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1)}

/* organiser */
.org{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:800;font-size:1rem}
.btn.go{background:var(--pink);color:var(--chalk);box-shadow:4px 4px 0 var(--sun)}
.btn.go.arm{background:var(--sun);color:var(--ink);box-shadow:4px 4px 0 var(--pink)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.25);padding:10px 16px;font-size:.9rem}

/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);border-top:3px solid var(--sun);display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.savebar span{font-weight:600}
.btn.save{background:var(--sun);color:var(--ink)}
.btn.save:disabled{opacity:.6;cursor:wait}
.notice{background:var(--tang);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:600}

/* finish */
.trophy{text-align:center;display:grid;gap:8px;justify-items:center}
.trophy .drink{color:var(--sun)}
.who{font-weight:800;font-size:.85rem;padding:4px 10px;border-radius:6px;border:2px solid var(--sky);color:var(--sky)}
.challenge .pen+.pen{font-weight:800}
.tcard h3 .tn{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.edit{border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--muted);border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:600}
.dirtytxt{color:var(--sun)}
.rename{display:flex;gap:8px;align-items:center}
.rename input{flex:1;min-width:0;font:inherit;font-weight:800;font-size:1.05rem;background:var(--turf);color:var(--chalk);border:2px solid var(--sun);border-radius:10px;padding:8px 10px}
.rename input:focus-visible{outline:3px solid var(--pink);outline-offset:1px}
.btn.mini{padding:9px 14px;font-size:.9rem;background:var(--sun);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pl2{color:var(--muted);font-weight:600}
.who-pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who-pick>span{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-right:4px}
.pickbtn{display:grid;justify-items:start;border:2px solid rgba(255,255,255,.25);background:transparent;color:var(--chalk);border-radius:12px;padding:6px 12px;font-weight:800}
.pickbtn small{font-weight:600;font-size:.7rem;color:var(--muted)}
.pickbtn.on{background:var(--tc);border-color:var(--tc);color:var(--ink)}
.pickbtn.on small{color:var(--ink)}
.pickbtn.dirty{box-shadow:0 0 0 3px var(--sun)}
.pickbtn:disabled{cursor:default}
.ro .pickbtn:not(.on){opacity:.45}
.hint{color:var(--muted);font-size:.9rem}
tr.teamrow td{font-weight:800;background:#f7faf4}
tr.teamrow td.n{border-left:8px solid var(--tc)}
td.n.sub{padding-left:24px;font-weight:400;color:#4b5a4f}
td.sat{color:#b5bdb3;font-size:.75rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

var DEFAULT={hole:0,teams:{"t1": {"name": "Hole in Wine", "players": ["Bjørne", "Ingunn"], "color": "#ff4fa3", "ink": "#c4166f"}, "t2": {"name": "Sip Happens", "players": ["Oli", "Smilla"], "color": "#4cc9ff", "ink": "#0a78a8"}, "t3": {"name": "The Mulligans", "players": ["Noah", "Eva"], "color": "#ffd23f", "ink": "#9a7600"}, "t4": {"name": "Bogey Boys", "players": ["Freddy", "Albin"], "color": "#ff8a3d", "ink": "#b9520c"}, "t5": {"name": "Birdie Brains", "players": ["Halvor", "Alma"], "color": "#b48cff", "ink": "#6a3fd0"}}};
var MYTEAM="pubgolf-myteam";
var ADMIN=/[?&]admin\b/.test(location.search);
var state={hole:0,teams:DEFAULT.teams,scores:{},picks:{}};
var mode="connecting"; // connecting | live | offline | setup
var root=null, notice="", armed=null, armTimer=null, editing=null, loaded=false;

function ls(fn){try{return fn()}catch(e){return null}}
function key(h,p){return h+"|"+p}
function teamList(){return Object.keys(state.teams||{}).sort().map(function(id){var t=state.teams[id];t.id=id;return t})}
function get(h,p){var v=(state.scores||{})[key(h,p)];return v?[v.s==null?null:v.s,v.p||0]:[null,0]}
function pick(h,t){return h<2?null:((state.picks||{})[key(h,t.id)]||null)}
function players(h,t){if(h<2)return t.players;var p=pick(h,t);return p?[p]:[]}
function teamPar(h){return h===1?HOLES[1].par*2:HOLES[h].par}

function vsPar(d){return d===0?"E":(d>0?"+"+d:""+d)}
function cls(d){return d<0?"under":(d>0?"over":"")}
function term(strokes,par,total){
  if(strokes===1&&par>1&&total===1)return"Hole in one";
  var d=total-par;
  return {"-3":"Albatross","-2":"Eagle","-1":"Birdie","0":"Par","1":"Bogey","2":"Double bogey","3":"Triple bogey"}[d]||(d>0?"+"+d+" over":d+" under");
}
function teamHole(h,t){
  var ps=players(h,t);if(!ps.length)return null;
  var tot=0;
  for(var i=0;i<ps.length;i++){var s=get(h,ps[i]);if(s[0]==null)return null;tot+=s[0]+s[1];}
  return tot;
}
function standings(){
  var maxH=Math.min(state.hole,9);
  return teamList().map(function(t){
    var tot=0,diff=0,thru=0;
    for(var h=1;h<=maxH;h++){var v=teamHole(h,t);if(v!=null){tot+=v;diff+=v-teamPar(h);thru++;}}
    return {t:t,tot:tot,diff:diff,thru:thru};
  }).sort(function(a,b){return a.diff-b.diff||a.tot-b.tot});
}
function played(t,p){var n=0;for(var h=2;h<=Math.min(state.hole,9);h++)if(pick(h,t)===p)n++;return n}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function maps(h){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(h.venue+", "+h.addr)}

function stepper(p,s){
  return '<div class="step"><label>Sips</label><div class="ctl"><button data-a="s-" data-p="'+esc(p)+'" aria-label="One fewer sip for '+esc(p)+'">−</button><output>'+(s[0]==null?"–":s[0])+'</output><button data-a="s+" data-p="'+esc(p)+'" aria-label="One more sip for '+esc(p)+'">+</button></div></div>'+
    '<div class="step pen"><label>Penalty</label><div class="ctl"><button data-a="p-" data-p="'+esc(p)+'" aria-label="Remove penalty for '+esc(p)+'">−</button><output>'+s[1]+'</output><button data-a="p+" data-p="'+esc(p)+'" aria-label="Add penalty for '+esc(p)+'">+</button></div></div>';
}

function render(){
  var H=state.hole||0, cur=HOLES[Math.min(H,9)], ro=(mode==="setup"||!loaded);
  var my=ls(function(){return localStorage.getItem(MYTEAM)})||"";
  var teams=teamList();
  var chip=mode==="live"?'<span class="chip"><i class="dot"></i>Live</span>'
    :mode==="offline"?'<span class="chip warn"><i class="dot"></i>Offline · will sync</span>'
    :mode==="setup"?'<span class="chip off"><i class="dot"></i>Not connected</span>'
    :'<span class="chip warn"><i class="dot"></i>Connecting</span>';

  var rail='<div class="rail" aria-label="Course progress">';
  for(var i=0;i<=9;i++)rail+='<span class="'+(i<H||H>9?"done":(i===H?"now":""))+'"></span>';
  rail+='</div>';

  var html='<header class="top"><div class="brand">West End Pub Golf<small>9 holes · team par 32 · 5 teams</small></div>'+chip+'</header>'+rail;
  if(mode==="setup")html+='<div class="notice" role="status">Scores can\'t sync yet. Paste your Firebase config at the top of index.html.</div>';
  if(notice)html+='<div class="notice" role="status">'+esc(notice)+'</div>';

  if(H===0){
    var w=HOLES[0];
    html+='<section class="hole"><div class="pin"><div class="flag"><b>0</b></div><i class="cup"></i></div><div class="hole-body"><span class="eyebrow">Warm-up · before hole 1</span><h1 class="drink">'+esc(w.drink)+'</h1><div class="venue">At home, before we head out</div><div class="meta"><span class="par">NOT SCORED</span></div></div>'+
      '<div class="challenge"><span class="eyebrow">The deal</span><p>'+esc(w.challenge)+'</p><span class="pen">Pick your team name below while you drink. Hole 1 stays hidden until the organiser tees off.</span></div></section>';
  }else if(H>9){
    var s0=standings()[0];
    html+='<section class="trophy"><span class="eyebrow">Round complete</span><h1 class="drink">'+esc(s0.t.name)+' win</h1><div class="venue">'+esc(s0.t.players.join(" & "))+'</div><div class="meta"><span class="par">'+vsPar(s0.diff)+' · '+s0.tot+' strokes</span></div></section>';
  }else{
    var who=H===1?"Both golfers on every team play this hole. Team par is "+teamPar(1)+".":"One golfer per team plays this hole. The team picks who.";
    html+='<section class="hole"><div class="pin"><div class="flag"><b>'+H+'</b></div><i class="cup"></i></div><div class="hole-body"><span class="eyebrow">Hole '+H+' of 9</span><h1 class="drink">'+esc(cur.drink)+'</h1>'+
      '<div class="venue"><a href="'+maps(cur)+'" target="_blank" rel="noopener">'+esc(cur.venue)+'</a></div>'+
      '<div class="meta"><span class="par">PAR '+cur.par+'</span><span class="who">'+(H===1?"Both play":"1 golfer per team")+'</span></div><div class="walk">'+esc(cur.walk)+'</div></div>'+
      '<div class="challenge"><span class="eyebrow">Hole challenge</span><p>'+esc(cur.challenge)+'</p><span class="pen">Penalty: '+esc(cur.penalty)+'</span><span class="pen">'+who+'</span></div></section>';
  }

  var order=teams.slice().sort(function(a,b){return (b.id===my)-(a.id===my)});
  var inPlay=H>=1&&H<=9;
  html+='<section class="sec'+(ro?" ro":"")+'"><div class="sec-h"><h2>'+(inPlay?"Hole "+H+" scores":"Teams")+'</h2><p>'+(inPlay?"Sips to finish, plus penalties. Saves as you tap.":"Tap Rename to choose your team name")+'</p></div>';
  html+='<div class="mine"><label for="myteam">My team</label><select id="myteam"><option value="">Choose…</option>'+teams.map(function(t){return'<option value="'+t.id+'"'+(t.id===my?" selected":"")+'>'+esc(t.name)+'</option>'}).join("")+'</select></div><div class="teams">';
  order.forEach(function(t){
    var head;
    if(editing===t.id&&!ro){
      head='<form class="rename" data-t="'+t.id+'"><label class="sr" for="nm-'+t.id+'">Team name</label><input id="nm-'+t.id+'" maxlength="28" value="'+esc(t.name)+'" autocomplete="off"><button class="btn mini" type="submit">Done</button></form>';
    }else{
      var res=inPlay?teamHole(H,t):null;
      head='<h3><span class="tn">'+esc(t.name)+(ro?"":' <button class="edit" data-rename="'+t.id+'" aria-label="Rename '+esc(t.name)+'">Rename</button>')+'</span><span class="tsum '+(res!=null?cls(res-teamPar(H)):"")+'">'+(res!=null?vsPar(res-teamPar(H))+" this hole":"")+'</span></h3>';
    }
    var body="";
    if(!inPlay){
      body='<div class="pl2">'+esc(t.players.join(" & "))+'</div>';
    }else{
      if(H>=2){
        var pk=pick(H,t);
        body+='<div class="who-pick"><span>Who\'s up?</span>'+t.players.map(function(p){
          return '<button class="pickbtn'+(pk===p?" on":"")+'" data-pick="'+esc(p)+'" data-t="'+t.id+'"'+(ro?" disabled":"")+'>'+esc(p)+'<small>'+played(t,p)+' played</small></button>';
        }).join("")+'</div>';
        if(!pk)body+='<div class="hint">Pick who drinks this hole to enter a score.</div>';
      }
      players(H,t).forEach(function(p){
        var s=get(H,p);
        var sub=s[0]==null?"Not in yet":term(s[0],cur.par,s[0]+s[1])+" · "+(s[0]+s[1]);
        body+='<div class="prow"><div class="pname">'+esc(p)+'<small>'+sub+'</small></div>'+stepper(p,s)+'</div>';
      });
    }
    html+='<div class="tcard'+(t.id===my?" me":"")+'" style="--tc:'+t.color+'">'+head+body+'</div>';
  });
  html+='</div></section>';

  var st=standings();
  html+='<section class="sec"><div class="sec-h"><h2>Leaderboard</h2><p>Lowest score wins</p></div><div class="board">';
  st.forEach(function(r,i){
    html+='<div class="row'+(i===0&&r.tot>0?" lead":"")+'" style="--tc:'+r.t.color+';--tc-ink:'+r.t.ink+'"><div class="pos">'+(i+1)+'</div><div><div class="tn">'+esc(r.t.name)+'</div><div class="pl">'+esc(r.t.players.join(" & "))+'</div></div><div class="tot"><b class="'+cls(r.diff)+'">'+vsPar(r.diff)+'</b><span>'+r.tot+' strokes · thru '+r.thru+'</span></div></div>';
  });
  html+='</div></section>';

  var shown=Math.min(H,9),parTot=0;
  html+='<section class="sec"><div class="sec-h"><h2>Scorecard</h2><p>Team par: hole 1 counts double</p></div><div class="cardwrap"><table><thead><tr><th class="n">Golfer</th>';
  for(var h=1;h<=9;h++)html+='<th>'+h+'</th>';
  html+='<th>Tot</th></tr></thead><tbody><tr class="parrow"><td class="n">Team par</td>';
  for(h=1;h<=9;h++){if(h<=shown){parTot+=teamPar(h);html+='<td>'+teamPar(h)+'</td>'}else html+='<td>?</td>';}
  html+='<td class="tot">'+parTot+'</td></tr>';
  teams.forEach(function(t){
    var ttot=0,trow='';
    for(var h=1;h<=9;h++){
      if(h>shown){trow+='<td class="hidden">·</td>';continue;}
      var v=teamHole(h,t);
      if(v==null){trow+='<td'+(h===H?' class="cur"':'')+'>–</td>';continue;}
      var d=v-teamPar(h);ttot+=v;
      trow+='<td'+(h===H?' class="cur"':'')+'><span class="badge '+(d<0?"b-under":d===0?"b-par":d===1?"b-over":"b-bad")+'">'+v+'</span></td>';
    }
    html+='<tr class="tsep teamrow" style="--tc:'+t.color+'"><td class="n">'+esc(t.name)+'</td>'+trow+'<td class="tot">'+(ttot||"–")+'</td></tr>';
    t.players.forEach(function(p){
      var tot=0;
      html+='<tr><td class="n sub">'+esc(p)+'</td>';
      for(var h=1;h<=9;h++){
        if(h>shown){html+='<td class="hidden">·</td>';continue;}
        if(players(h,t).indexOf(p)<0){html+='<td class="sat'+(h===H?' cur':'')+'">'+(h>=2&&pick(h,t)?"out":"–")+'</td>';continue;}
        var s=get(h,p);
        if(s[0]==null){html+='<td'+(h===H?' class="cur"':'')+'>–</td>';continue;}
        tot+=s[0]+s[1];
        html+='<td'+(h===H?' class="cur"':'')+'>'+(s[0]+s[1])+'</td>';
      }
      html+='<td class="tot">'+(tot||"–")+'</td></tr>';
    });
  });
  html+='</tbody></table></div></section>';

  if(ADMIN&&!ro){
    var label=H>=9?(H===9?"Finish the round":""):"Tee off hole "+(H+1);
    html+='<section class="sec"><div class="sec-h"><h2>Organiser</h2><p>Only on your admin link</p></div><div class="org">'+
      (label?'<button id="adv" class="btn go'+(armed==="adv"?" arm":"")+'">'+(armed==="adv"?"Tap again to confirm":label)+'</button>':'')+
      (H>0?'<button id="back" class="btn ghost">Back one hole</button>':'')+
      '<button id="wipe" class="btn ghost">'+(armed==="wipe"?"Tap again: wipes every score":"Reset game")+'</button></div></section>';
  }

  html+='<section class="sec"><div class="sec-h"><h2>House rules</h2></div><div class="rules"><ol>'+
    '<li><b>Count your sips.</b> Every sip it takes to finish the drink is one stroke. A drink downed in one go is a hole in one.</li>'+
    '<li><b>Penalties go on top.</b> Fail the hole challenge and add the penalty strokes shown on the hole card.</li>'+
    '<li><b>Hole 1 is a team effort.</b> Both golfers drink and both scores count, so team par is doubled.</li>'+
    '<li><b>From hole 2, one golfer per team.</b> The team picks who drinks each hole. That golfer\'s score is the team score.</li>'+
    '<li><b>Lowest team score wins.</b> Shown against par on the leaderboard.</li>'+
    '<li><b>Finish the drink before you leave the hole.</b> Leftovers are a +2.</li>'+
    '<li><b>One hole at a time.</b> The next venue and challenge stay hidden until the organiser tees off.</li>'+
    '<li><b>Water hazard.</b> A glass of water between holes is free and strongly advised.</li>'+
    '</ol><div class="terms"><span>Hole in one = 1 sip</span><span>Eagle −2</span><span>Birdie −1</span><span>Par E</span><span>Bogey +1</span><span>Double bogey +2</span></div></div></section>';

  document.getElementById("app").innerHTML='<div class="wrap">'+html+'</div>';
  if(editing){var inp=document.getElementById("nm-"+editing);if(inp){inp.focus();inp.select();}}
}

function write(path,val){
  if(!root)return;
  root.child(path).set(val).catch(function(){notice="That change was refused by the database. Check the database rules.";render();});
}
function arm(id){armed=id;render();clearTimeout(armTimer);armTimer=setTimeout(function(){armed=null;render()},4000);}

document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||!root)return;
  var H=state.hole;
  if(b.dataset.a){
    var p=b.dataset.p,s=get(H,p),a=b.dataset.a;
    if(a==="s+")s[0]=s[0]==null?1:s[0]+1;
    if(a==="s-")s[0]=s[0]==null||s[0]<=1?null:s[0]-1;
    if(a==="p+")s[1]++;
    if(a==="p-")s[1]=Math.max(0,s[1]-1);
    write("scores/"+key(H,p),(s[0]==null&&!s[1])?null:{s:s[0],p:s[1]});
    return;
  }
  if(b.dataset.pick){write("picks/"+key(H,b.dataset.t),b.dataset.pick);return;}
  if(b.dataset.rename){editing=b.dataset.rename;render();return;}
  if(b.id==="adv"){if(armed!=="adv")return arm("adv");armed=null;write("hole",Math.min(10,H+1));return;}
  if(b.id==="back"){write("hole",Math.max(0,H-1));return;}
  if(b.id==="wipe"){if(armed!=="wipe")return arm("wipe");armed=null;root.set(DEFAULT);return;}
});
document.addEventListener("submit",function(e){
  var f=e.target.closest("form.rename");if(!f)return;
  e.preventDefault();
  var v=f.querySelector("input").value.trim().slice(0,28);
  if(v)write("teams/"+f.dataset.t+"/name",v);
  editing=null;render();
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&editing){editing=null;render();}});
document.addEventListener("change",function(e){
  if(e.target.id==="myteam"){ls(function(){localStorage.setItem(MYTEAM,e.target.value)});render();}
});

render();
if(!window.firebase||/PASTE_HERE/.test(FIREBASE_CONFIG.databaseURL)){mode="setup";render();return;}
try{
  firebase.initializeApp(FIREBASE_CONFIG);
  var db=firebase.database();
  root=db.ref("pubgolf");
  root.transaction(function(cur){return cur||DEFAULT});
  root.on("value",function(snap){
    var v=snap.val();
    if(v){state={hole:v.hole||0,teams:v.teams||DEFAULT.teams,scores:v.scores||{},picks:v.picks||{}};loaded=true;}
    if(mode==="connecting")mode="live";
    render();
  },function(){notice="The database refused to load the game. Check the database rules.";render();});
  db.ref(".info/connected").on("value",function(s){if(loaded){mode=s.val()?"live":"offline";render();}});
}catch(err){mode="setup";notice="Firebase didn't start: "+err.message;render();}
})();
</script>
